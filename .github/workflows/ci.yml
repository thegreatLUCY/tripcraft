name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Mobile has fragile peer deps; matches how the lockfile was generated.
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Shared package tests
        run: npm test --workspace @tripcraft/shared

      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

      # `next build` also runs the TypeScript check and validates that the
      # @tripcraft/shared workspace package resolves under the bundler.
      - name: Build web
        run: npm run build --workspace web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
